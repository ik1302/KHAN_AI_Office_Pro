<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Government office drafting and document analysis assistant." />
    <title>KHAN AI Office Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="masthead">
        <div class="seal" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img"><path d="M24 5 8 13v4h32v-4L24 5Zm-12 15v14H9v5h30v-5h-3V20h-4v14h-6V20h-4v14h-6V20h-4Z" /></svg>
        </div>
        <div>
          <p class="eyebrow">Government Office Smart Assistant</p>
          <h1>KHAN AI Office Pro</h1>
        </div>
        <div class="status"><span></span> Secure workspace</div>
      </header>

      <main class="workspace">
        <section class="brief-panel">
          <div class="section-heading">
            <span>01</span>
            <div><p>Drafting brief</p><h2>Prepare your document</h2></div>
          </div>

          <form id="draft-form">
            <div class="field-grid">
              <label>Language
                <select id="language" name="language">
                  <option>Marathi</option>
                  <option>English</option>
                </select>
              </label>
              <label>Document type
                <select id="task" name="task">
                  <option>Letter Drafting</option>
                  <option>GR Analysis</option>
                  <option>Note Sheet</option>
                  <option>WhatsApp Message</option>
                  <option>Press Note</option>
                  <option>Meeting Proceedings</option>
                  <option>Resolution Draft</option>
                  <option>Inspection Report</option>
                  <option>Excel Analysis</option>
                </select>
              </label>
            </div>

            <label class="details-label">Instructions and details
              <textarea id="details" name="details" rows="9" placeholder="Enter the subject, reference, key facts, dates, names, and the outcome required..."></textarea>
            </label>

            <div id="upload-wrap" class="upload-wrap" hidden>
              <label for="source-file" class="upload-box">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4" /></svg>
                <strong id="upload-title">Attach source document</strong>
                <span id="upload-help">Choose a file for analysis</span>
                <input id="source-file" type="file" />
              </label>
              <p id="file-status" class="file-status"></p>
            </div>

            <p id="form-error" class="form-error" role="alert"></p>
            <button id="generate-button" class="primary-button" type="submit">
              <span>Generate official draft</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </form>
        </section>

        <section class="output-panel">
          <div class="section-heading">
            <span>02</span>
            <div><p>Generated document</p><h2>Review and export</h2></div>
          </div>

          <div id="empty-state" class="empty-state">
            <div class="paper-mark"><i></i><i></i><i></i><i></i></div>
            <h3>Your draft appears here</h3>
            <p>Complete the brief and generate a document ready for review.</p>
          </div>

          <div id="loading-state" class="loading-state" hidden aria-live="polite">
            <div class="skeleton wide"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton short"></div>
            <p>Preparing the official draft…</p>
          </div>

          <div id="result-state" class="result-state" hidden>
            <div class="result-actions">
              <button id="copy-button" type="button">Copy text</button>
              <button id="print-button" type="button">Save as PDF</button>
            </div>
            <article id="output" tabindex="0"></article>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
